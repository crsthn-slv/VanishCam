name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: swift build -c release
      - run: swift test -c release
